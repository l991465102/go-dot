# Isolated ports for release acceptance. Combine this file with a unique
# Compose project name so existing local databases and volumes are untouched.
services:
  mysql:
    ports: !override ["127.0.0.1:13306:3306"]
  redis:
    ports: !override ["127.0.0.1:16379:6379"]
  clickhouse:
    ports: !override ["127.0.0.1:18123:8123", "127.0.0.1:19001:9000"]
  api:
    ports: !override ["127.0.0.1:18080:8080"]
  web:
    ports: !override ["127.0.0.1:15173:80"]
  prometheus:
    ports: !override ["127.0.0.1:19090:9090"]
