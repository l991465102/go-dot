global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: go-dot-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
  - job_name: go-dot-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:9091]
  - job_name: go-dot-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: [scheduler:9091]
