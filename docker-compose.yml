services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: go_dot
      MYSQL_ROOT_PASSWORD: ${GO_DOT_MYSQL_ROOT_PASSWORD:?copy .env.example to .env and replace GO_DOT_MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: go_dot
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/users.xml:/etc/clickhouse-server/users.d/go-dot.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["migrate"]
    environment: &backend-environment
      GO_DOT_MYSQL_DSN: ${GO_DOT_MYSQL_DSN:?copy .env.example to .env and set GO_DOT_MYSQL_DSN}
      GO_DOT_REDIS_ADDRESS: ${GO_DOT_REDIS_ADDRESS:?copy .env.example to .env and set GO_DOT_REDIS_ADDRESS}
      GO_DOT_CLICKHOUSE_DSN: ${GO_DOT_CLICKHOUSE_DSN:?copy .env.example to .env and set GO_DOT_CLICKHOUSE_DSN}
      GO_DOT_JWT_SECRET: ${GO_DOT_JWT_SECRET:?copy .env.example to .env and replace GO_DOT_JWT_SECRET}
      GO_DOT_VISITOR_MASTER_KEY: ${GO_DOT_VISITOR_MASTER_KEY:?copy .env.example to .env and replace GO_DOT_VISITOR_MASTER_KEY}
      GO_DOT_QUEUE_EVENT_STREAM: ${GO_DOT_QUEUE_EVENT_STREAM:-tracking:{queue}:events}
      GO_DOT_QUEUE_INVALID_STREAM: ${GO_DOT_QUEUE_INVALID_STREAM:-tracking:{queue}:invalid}
      GO_DOT_QUEUE_DEAD_STREAM: ${GO_DOT_QUEUE_DEAD_STREAM:-tracking:{queue}:dead}
      GO_DOT_QUEUE_CONSUMER_GROUP: ${GO_DOT_QUEUE_CONSUMER_GROUP:-tracking-workers}
      GO_DOT_QUEUE_PUBLISH_DEDUP_TTL: ${GO_DOT_QUEUE_PUBLISH_DEDUP_TTL:-72h}
      GO_DOT_WORKER_CONCURRENCY: ${GO_DOT_WORKER_CONCURRENCY:-8}
      GO_DOT_WORKER_MAX_DELIVERIES: ${GO_DOT_WORKER_MAX_DELIVERIES:-5}
      GO_DOT_WORKER_RECLAIM_IDLE: ${GO_DOT_WORKER_RECLAIM_IDLE:-30s}
      GO_DOT_WORKER_DRAIN_TIMEOUT: ${GO_DOT_WORKER_DRAIN_TIMEOUT:-30s}
      GO_DOT_WORKER_RETRY_BASE: ${GO_DOT_WORKER_RETRY_BASE:-1s}
      GO_DOT_WORKER_RETRY_MAX: ${GO_DOT_WORKER_RETRY_MAX:-1m}
      GO_DOT_SCHEDULER_AGGREGATE_EVERY: ${GO_DOT_SCHEDULER_AGGREGATE_EVERY:-1m}
      GO_DOT_SCHEDULER_AGGREGATE_LOOKBACK_HOURS: ${GO_DOT_SCHEDULER_AGGREGATE_LOOKBACK_HOURS:-2}
      GO_DOT_SCHEDULER_RECLAIM_EVERY: ${GO_DOT_SCHEDULER_RECLAIM_EVERY:-15s}
      GO_DOT_SCHEDULER_METRICS_EVERY: ${GO_DOT_SCHEDULER_METRICS_EVERY:-1m}
      GO_DOT_SCHEDULER_EXPIRE_KEYS_EVERY: ${GO_DOT_SCHEDULER_EXPIRE_KEYS_EVERY:-1h}
      GO_DOT_SCHEDULER_RECLAIM_IDLE: ${GO_DOT_SCHEDULER_RECLAIM_IDLE:-1m}
      GO_DOT_SCHEDULER_LEASE_TTL: ${GO_DOT_SCHEDULER_LEASE_TTL:-2m}
      GO_DOT_SCHEDULER_BATCH_SIZE: ${GO_DOT_SCHEDULER_BATCH_SIZE:-100}
      # Set true only when the browser-facing deployment is served through HTTPS.
      GO_DOT_SECURE_COOKIES: ${GO_DOT_SECURE_COOKIES:-false}
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["api"]
    environment: *backend-environment
    ports:
      - "8080:8080"
    depends_on: &backend-dependencies
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["worker"]
    environment:
      <<: *backend-environment
      GO_DOT_METRICS_ADDRESS: ":9091"
    depends_on: *backend-dependencies

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["scheduler"]
    environment:
      <<: *backend-environment
      GO_DOT_METRICS_ADDRESS: ":9091"
    depends_on: *backend-dependencies

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.8.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  mysql_data: 
  redis_data:
  clickhouse_data:
  prometheus_data:
